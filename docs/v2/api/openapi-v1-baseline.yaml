openapi: 3.1.0
info:
  title: Hey Money API V1 Baseline
  version: 1.0.0-baseline
  description: >-
    Source-derived Phase 1 skeleton for all 55 mounted V1 operations. Detailed
    request/response schemas remain governed by endpoint-inventory.md until they
    are promoted into this specification and verified by contract fixtures.
  contact:
    name: API platform owner
servers:
  - url: /
    description: Legacy unversioned V1 mount
  - url: /api/v1
    description: Versioned V1 compatibility mount
security:
  - accessTokenCookie: []
tags:
  - { name: system }
  - { name: users }
  - { name: accounts }
  - { name: accumulations }
  - { name: savings }
  - { name: money-sources }
  - { name: transactions }
  - { name: budgets }
  - { name: categories }
  - { name: contacts }
  - { name: families }
  - { name: banks }
  - { name: loans }
  - { name: notifications }
paths:
  /:
    get:
      operationId: getLegacyRoot
      tags: [system]
      security: []
      responses:
        '200': { $ref: '#/components/responses/LegacySuccess' }
  /status:
    get:
      operationId: getV1Status
      tags: [system]
      security: []
      responses:
        '200': { $ref: '#/components/responses/LegacySuccess' }
  /users/register:
    post:
      operationId: registerUserV1
      tags: [users]
      security: []
      responses:
        '201': { $ref: '#/components/responses/LegacySuccess' }
        default: { $ref: '#/components/responses/LegacyError' }
  /users/verify:
    put:
      operationId: verifyUserV1
      tags: [users]
      security: []
      responses:
        '200': { $ref: '#/components/responses/LegacySuccess' }

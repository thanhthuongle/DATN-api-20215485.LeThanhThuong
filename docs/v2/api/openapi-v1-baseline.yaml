        default: { $ref: '#/components/responses/LegacyError' }
components:
  securitySchemes:
    accessTokenCookie:
      type: apiKey
      in: cookie
      name: accessToken
    refreshTokenCookie:
      type: apiKey
      in: cookie
      name: refreshToken
  parameters:
    AccountId: { name: accountId, in: path, required: true, schema: { $ref: '#/components/schemas/LegacyObjectId' } }
    AccumulationId: { name: accumulationId, in: path, required: true, schema: { $ref: '#/components/schemas/LegacyObjectId' } }
    SavingId: { name: savingId, in: path, required: true, schema: { $ref: '#/components/schemas/LegacyObjectId' } }
    FamilyId: { name: familyId, in: path, required: true, schema: { $ref: '#/components/schemas/LegacyObjectId' } }
    TransactionId: { name: transactionId, in: path, required: true, schema: { $ref: '#/components/schemas/LegacyObjectId' } }
    BankId: { name: bankId, in: path, required: true, schema: { type: string } }
    UserNotificationId: { name: userNotificationId, in: path, required: true, schema: { $ref: '#/components/schemas/LegacyObjectId' } }
  schemas:
    LegacyObjectId:
      type: string
      pattern: '^[0-9a-fA-F]{24}$'
    LegacyError:
      type: object
      required: [statusCode, message]
      properties:
        statusCode: { type: integer }
        message: { type: string }
        stack: { type: string, description: Present only when BUILD_MODE=dev }
    UndocumentedLegacyPayload:
      description: Schema pending fixture-backed promotion from the Wave 0 endpoint inventory.
  responses:
    LegacySuccess:
      description: Source-confirmed legacy success; payload schema is not yet fixture-verified.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/UndocumentedLegacyPayload' }
    LegacyError:
      description: V1 centralized error envelope.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/LegacyError' }

services:
  redis:
    image: redis:7
    container_name: redis-local
    ports:
      - "6379:6379"
    volumes:
      - ./redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hey_money_v2}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hey_money_v2_local_only}
      POSTGRES_DB: ${POSTGRES_DB:-hey_money_v2}
    ports:
      - "${POSTGRES_LOCAL_PORT:-5432}:5432"
    volumes:
      - postgres-v2-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  agenda-mongodb:
    image: mongo:7
    profiles: ["v2"]
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${AGENDA_MONGODB_USER:-agenda_v2}
      MONGO_INITDB_ROOT_PASSWORD: ${AGENDA_MONGODB_PASSWORD:-agenda_v2_local_only}
    ports:
      - "${AGENDA_MONGODB_LOCAL_PORT:-27018}:27017"
    volumes:
      - agenda-v2-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --username
        - ${AGENDA_MONGODB_USER:-agenda_v2}
        - --password
        - ${AGENDA_MONGODB_PASSWORD:-agenda_v2_local_only}
        - --authenticationDatabase
        - admin
        - --eval
        - db.adminCommand('ping').ok
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-v2-data:
  agenda-v2-data:
